name: Prepare draft GitHub release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.1.25
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate requested version tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: aiml
          python-version: '3.12'
          auto-activate-base: false
      - name: Verify tag and prepare release files
        shell: bash -el {0}
        run: |
          npm ci
          npm run version:check -- "$RELEASE_TAG"
          npm run release:prepare
      - name: Create a draft for human review
        shell: bash -el {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "$RELEASE_TAG" --notes-file "dist/RELEASE-NOTES-$version.md" \
            "dist/codex-ubuntu-notifications-$version.vsix" \
            "dist/codex-ubuntu-notifications-$version-marketplace.vsix" \
            "dist/SHA256SUMS-$version.txt" "dist/release-$version.json"
